name: CI
on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - uses: eed3si9n/scruff@v0.4.3
    - name: Setup Scala
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Build and test
      shell: bash
      run: |
        sbt -v "+ test"
        sbt -v "+ scripted"
